spring.application.name=ms-pagos
server.port=8083

#mercado pago
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}
mercadopago.base-url=${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}

#base de datos
spring.datasource.url=${PAGOS_DB_URL:jdbc:postgresql://localhost:5432/pagos}
spring.datasource.username=${PAGOS_DB_USER:usuario_pagos}
spring.datasource.password=${PAGOS_DB_PASSWORD:password_pagos}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tpi}
keycloak.client-id=${KEYCLOAK_SERVICE_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_SERVICE_CLIENT_SECRET}


#swagger
springdoc.api-docs.server.url=http://localhost:8081


#client
keycloak.base-url=${KEYCLOAK_BASE_URL:http://keycloak:8080}
reservas.base-url=${RESERVAS_SERVICE_URL:http://ms-salidas-y-reservas:8082}


#logs
logging.level.root=INFO
logging.level.com.tpbackend.ms_pagos=DEBUG
logging.level.com.tpbackend.ms_pagos.pagos=DEBUG
logging.level.com.tpbackend.ms_pagos.mercado_pago=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO