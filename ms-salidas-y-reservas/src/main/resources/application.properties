spring.application.name=ms-salidas-y-reservas
server.port=8082

#base de datos
spring.datasource.url=${SALIDAS_DB_URL:jdbc:postgresql://localhost:5432/salidas_reservas}
spring.datasource.username=${SALIDAS_DB_USER:usuario_salidas}
spring.datasource.password=${SALIDAS_DB_PASSWORD:password_salidas}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tpi}

#swagger
springdoc.api-docs.server.url=http://localhost:8081

#logs
logging.level.root=INFO
logging.level.com.tpbackend.ms_salidas_y_reservas=DEBUG
logging.level.com.tpbackend.ms_salidas_y_reservas.salidas=DEBUG
logging.level.com.tpbackend.ms_salidas_y_reservas.reservas=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
