services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${DB_URL_KC_PG}
      KC_DB_USERNAME: ${DB_USER_KC_PG}                            
      KC_DB_PASSWORD: ${DB_PASSWORD_KC_PG}                        
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - red-datos
      - red-aplicacion

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_USER: ${DB_USER_KC_PG}       
      POSTGRES_PASSWORD: ${DB_PASSWORD_KC_PG}
      POSTGRES_DB: ${DB_NAME_KC_PG}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_KC_PG}"]
      interval: 5s
      retries: 10
      start_period: 90s
    networks:
      - red-datos

  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    environment:
      - CATALOGO_DB_URL=${CATALOGO_DB_URL}
      - CATALOGO_DB_USER=${CATALOGO_DB_USER}
      - CATALOGO_DB_PASSWORD=${CATALOGO_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - OPENMETEO_BASE_URL=${OPENMETEO_BASE_URL}
    volumes:
      - ./logs/catalogo:/app/logs
    depends_on:
      postgres-catalogo:
        condition: service_healthy
      keycloak:
        condition: service_started   
    networks:
      - red-aplicacion
      - red-datos

  ms-pagos:
    build:
      context: ./ms-pagos
      dockerfile: dockerfile
    container_name: ms-pagos
    environment:
      - PAGOS_DB_URL=${PAGOS_DB_URL}
      - PAGOS_DB_USER=${PAGOS_DB_USER}
      - PAGOS_DB_PASSWORD=${PAGOS_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_SERVICE_CLIENT_ID=${KEYCLOAK_SERVICE_CLIENT_ID}
      - KEYCLOAK_SERVICE_CLIENT_SECRET=${KEYCLOAK_SERVICE_CLIENT_SECRET}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - MERCADO_PAGO_BASE_URL=${MERCADO_PAGO_BASE_URL:-https://api.mercadopago.com}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET}
      - RESERVAS_SERVICE_URL=http://ms-salidas-y-reservas:8082
    volumes:
      - ./logs/pagos:/app/logs
    depends_on:
      postgres-pagos:
        condition: service_healthy
      keycloak:
        condition: service_started
      ms-salidas-y-reservas:
        condition: service_started
    networks:
      - red-aplicacion
      - red-datos

  postgres-pagos:
    image: postgres:16-alpine
    container_name: postgres-pagos
    environment:
      POSTGRES_USER: ${PAGOS_DB_USER}
      POSTGRES_PASSWORD: ${PAGOS_DB_PASSWORD}
      POSTGRES_DB: ${PAGOS_DB_NAME}
    volumes:
      - pgdata-pagos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAGOS_DB_USER} -d ${PAGOS_DB_NAME}"]
      interval: 5s
      retries: 10
      start_period: 90s
    networks:
      - red-datos
  
  postgres-catalogo:
    image: postgres:16-alpine
    container_name: postgres-catalogo
    environment:
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
      POSTGRES_DB: ${CATALOGO_DB_NAME} 
    volumes:
      - pgdata-catalogo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGO_DB_USER} -d ${CATALOGO_DB_NAME}"]
      interval: 5s
      retries: 10
      start_period: 90s
    networks:
      - red-datos
  
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - red-logs
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    networks:
      - red-logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - red-logs
    depends_on:
      - loki
    
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - CATALOGO_SERVICE_URL=http://ms-catalogo:8081
      - SALIDAS_SERVICE_URL=http://ms-salidas-y-reservas:8082
      - PAGOS_SERVICE_URL=http://ms-pagos:8083
    ports:
      - "8081:8080"
    depends_on:
      - ms-catalogo
      - ms-salidas-y-reservas
      - ms-pagos
    networks:
      - red-aplicacion

  ngrok:
    image: ngrok/ngrok:3
    container_name: ngrok-tunnel
    command: ["http", "http://api-gateway:8080", "--url", "https://${NGROK_DOMAIN}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - api-gateway
    networks:
      - red-aplicacion

  ms-salidas-y-reservas:
    build:
      context: ./ms-salidas-y-reservas
      dockerfile: Dockerfile
    container_name: ms-salidas-y-reservas
    environment:
      - SALIDAS_DB_URL=${SALIDAS_DB_URL}
      - SALIDAS_DB_USER=${SALIDAS_DB_USER}
      - SALIDAS_DB_PASSWORD=${SALIDAS_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - CATALOGO_SERVICE_URL=http://ms-catalogo:8081
    volumes:
      - ./logs/salidas:/app/logs
    depends_on:
      postgres-salidas:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - red-aplicacion
      - red-datos

  postgres-salidas:
    image: postgres:16-alpine
    container_name: postgres-salidas
    environment:
      POSTGRES_USER: ${SALIDAS_DB_USER}
      POSTGRES_PASSWORD: ${SALIDAS_DB_PASSWORD}
      POSTGRES_DB: ${SALIDAS_DB_NAME}
    volumes:
      - pgdata-salidas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALIDAS_DB_USER} -d ${SALIDAS_DB_NAME}"]
      interval: 5s
      retries: 10
      start_period: 90s
    networks:
      - red-datos

    

volumes:
  pgdata:
  pgdata-catalogo:
  loki-data:
  grafana-data:
  pgdata-salidas:
  pgdata-pagos:

networks:
  red-datos:
    driver: bridge
    internal: true
  red-aplicacion:
    driver: bridge
  red-logs:
    driver: bridge