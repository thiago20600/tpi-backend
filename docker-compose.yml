services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${DB_URL_KC_PG}
      KC_DB_USERNAME: ${DB_USER_KC_PG}                            
      KC_DB_PASSWORD: ${DB_PASSWORD_KC_PG}                        
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - red-datos
      - red-aplicacion

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_USER: ${DB_USER_KC_PG}       
      POSTGRES_PASSWORD: ${DB_PASSWORD_KC_PG}
      POSTGRES_DB: ${DB_NAME_KC_PG}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_KC_PG}"]
      interval: 5s
      retries: 10
    networks:
      - red-datos

  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    environment:
      - CATALOGO_DB_URL=${CATALOGO_DB_URL}
      - CATALOGO_DB_USER=${CATALOGO_DB_USER}
      - CATALOGO_DB_PASSWORD=${CATALOGO_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
    #temporal para pruebas con swagger
    ports:
      - "8081:8081" 
    depends_on:
      postgres-catalogo:
        condition: service_healthy
      keycloak:
        condition: service_started   
    networks:
      - red-aplicacion
      - red-datos
  
  postgres-catalogo:
    image: postgres:16-alpine
    container_name: postgres-catalogo
    environment:
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
      POSTGRES_DB: ${CATALOGO_DB_NAME} 
    volumes:
      - pgdata-catalogo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGO_DB_USER} -d ${CATALOGO_DB_NAME}"]
      interval: 5s
      retries: 10
    networks:
      - red-datos

    

volumes:
  pgdata:
  pgdata-catalogo:

networks:
  red-datos:
    driver: bridge
    internal: true
  red-aplicacion:
    driver: bridge