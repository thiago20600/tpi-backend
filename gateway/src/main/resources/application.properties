spring.application.name=gateway
server.port=8080

spring.cloud.gateway.routes[0].id=catalogo
spring.cloud.gateway.routes[0].uri=${CATALOGO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/actividades/**

spring.cloud.gateway.routes[1].id=salidas
spring.cloud.gateway.routes[1].uri=${SALIDAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/salidas/**

spring.cloud.gateway.routes[2].id=catalogo-swagger
spring.cloud.gateway.routes[2].uri=${CATALOGO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[2].predicates[0]=Path=/catalogo/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/catalogo/v3/api-docs, /v3/api-docs

spring.cloud.gateway.routes[3].id=salidas-swagger
spring.cloud.gateway.routes[3].uri=${SALIDAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[3].predicates[0]=Path=/salidas/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/salidas/v3/api-docs, /v3/api-docs

spring.cloud.gateway.routes[4].id=reservas
spring.cloud.gateway.routes[4].uri=${SALIDAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/reservas/**

spring.cloud.gateway.routes[5].id=pagos
spring.cloud.gateway.routes[5].uri=${PAGOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/pagos/**

spring.cloud.gateway.routes[6].id=pagos-swagger
spring.cloud.gateway.routes[6].uri=${PAGOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[6].predicates[0]=Path=/pagos/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/pagos/v3/api-docs, /v3/api-docs

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tpi}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Catalogo
springdoc.swagger-ui.urls[0].url=/catalogo/v3/api-docs
springdoc.swagger-ui.urls[1].name=Salidas
springdoc.swagger-ui.urls[1].url=/salidas/v3/api-docs
springdoc.swagger-ui.urls[2].name=Pagos
springdoc.swagger-ui.urls[2].url=/pagos/v3/api-docs


logging.level.org.springframework.cloud.gateway=DEBUG