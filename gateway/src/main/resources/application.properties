spring.application.name=gateway
server.port=8080

spring.cloud.gateway.routes[0].id=catalogo
spring.cloud.gateway.routes[0].uri=${CATALOGO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/actividades/**

spring.cloud.gateway.routes[1].id=salidas
spring.cloud.gateway.routes[1].uri=${SALIDAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/salidas/**

spring.cloud.gateway.routes[2].id=catalogo-swagger
spring.cloud.gateway.routes[2].uri=${CATALOGO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[2].predicates[0]=Path=/catalogo/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/catalogo/(?<segment>.*), /$\{segment}

spring.cloud.gateway.routes[3].id=salidas-swagger
spring.cloud.gateway.routes[3].uri=${SALIDAS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[3].predicates[0]=Path=/salidas/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/salidas/(?<segment>.*), /$\{segment}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tpi}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Catalogo
springdoc.swagger-ui.urls[0].url=/catalogo/v3/api-docs
springdoc.swagger-ui.urls[1].name=Salidas
springdoc.swagger-ui.urls[1].url=/salidas/v3/api-docs