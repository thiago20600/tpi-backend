spring.application.name=ms-catalogo

#base de datos
spring.datasource.url=${CATALOGO_DB_URL:jdbc:postgresql://localhost:5432/catalogo}
spring.datasource.username=${CATALOGO_DB_USER:usuario_catalogo}
spring.datasource.password=${CATALOGO_DB_PASSWORD:password_catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tpi-realm}


#openmeteo
openmeteo.base-url=${OPENMETEO_BASE_URL:https://api.open-meteo.com}


#paginacion
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.default-page-size=20